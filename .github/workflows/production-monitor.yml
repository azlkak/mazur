name: Production health
on:
  push:
    branches: [main]
    paths: ['scripts/check-production.py', '.github/workflows/production-monitor.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check public site, offers, sitemap and images
        run: python3 scripts/check-production.py | tee health-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-result
          path: health-result.json
          retention-days: 14
