name: Description and importer checks
on:
  push:
    branches: [feat/formatted-offer-descriptions, main]
    paths:
      - 'assets/js/offer-description.js'
      - 'assets/js/results-gallery.js'
      - 'assets/css/offer-description.css'
      - 'oferta/script.js'
      - 'server/mls/public/api/description-formatter.php'
      - 'server/mls/public/api/mls-offer.php'
      - 'scripts/test-description-formatter.php'
      - 'scripts/test-offer-description.mjs'
      - 'scripts/test-results-gallery.mjs'
      - 'wyniki-wyszukiwania/script.js'
      - 'server/mls/private/bin/import.php'
      - 'scripts/test-importer-regions.php'
      - '.github/workflows/description-checks.yml'
  pull_request:
    paths:
      - 'assets/js/offer-description.js'
      - 'assets/js/results-gallery.js'
      - 'assets/css/offer-description.css'
      - 'oferta/script.js'
      - 'server/mls/public/api/description-formatter.php'
      - 'server/mls/public/api/mls-offer.php'
      - 'scripts/test-description-formatter.php'
      - 'scripts/test-offer-description.mjs'
      - 'scripts/test-results-gallery.mjs'
      - 'wyniki-wyszukiwania/script.js'
      - 'server/mls/private/bin/import.php'
      - 'scripts/test-importer-regions.php'
      - '.github/workflows/description-checks.yml'
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source commit without credentials
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/azlkak/mazur.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: PHP syntax and source-preservation checks
        run: |
          php -v
          php -l server/mls/public/api/description-formatter.php
          php -l server/mls/public/api/mls-offer.php
          php scripts/test-description-formatter.php --require-dom
          php -l server/mls/private/bin/import.php
          php scripts/test-importer-regions.php
      - name: JavaScript syntax and description regression checks
        run: |
          node --check oferta/script.js
          node --check assets/js/offer-description.js
          node --check assets/js/results-gallery.js
          node --check wyniki-wyszukiwania/script.js
          node --test scripts/test-offer-description.mjs scripts/test-results-gallery.mjs
